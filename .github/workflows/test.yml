name: Stele CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Full suite, including live containment on every backend: bubblewrap, the
  # OCI backend on rootless Podman and on Docker with runc, and Docker with
  # gVisor (runsc). The bubblewrap sandbox only exposes /usr, so the
  # interpreter must be the system Python: the venv below is built from
  # /usr/bin/python3 and resolves back to it. Containers use their own image.
  linux-containment:
    runs-on: ubuntu-24.04
    # The suite takes about 4 minutes. A container engine that stops answering
    # has hung this job for over an hour; the per-test timeout below names the
    # stuck test, and this bounds whatever it cannot catch (install, pull).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install containment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor-profiles apparmor-utils bubblewrap python3-venv podman runsc
          sudo install -m 0644 \
            /usr/share/apparmor/extra-profiles/bwrap-userns-restrict \
            /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Prove bubblewrap namespace support
        run: |
          bwrap \
            --ro-bind / / \
            --unshare-user --uid 0 --gid 0 \
            --unshare-net \
            -- /usr/bin/true
      - name: Install Stele with declared dev dependencies
        run: |
          /usr/bin/python3 -m venv .venv
          .venv/bin/pip install -e '.[dev]'
      - name: Register gVisor with Docker
        # --network=none: gVisor builds no network stack at all (loopback
        # only). Parsers never get a network, and Docker's --network none
        # alone is refused by runsc on these runners ("cannot run with
        # network enabled in root network namespace").
        run: |
          sudo runsc install -- --network=none
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      - name: Fetch the pinned parser image (trusted acquisition step)
        # Stele never pulls at run time; the image must be present beforehand.
        run: |
          IMAGE=$(.venv/bin/python -c 'from stele.containment.oci import DEFAULT_OCI_IMAGE; print(DEFAULT_OCI_IMAGE)')
          docker pull "$IMAGE"
          podman pull "$IMAGE"
      - name: Run Stele suite (no skips allowed)
        # `shell: bash` runs with -eo pipefail, so a failing pytest fails the
        # step even though its output is piped through tee.
        shell: bash
        run: |
          # --timeout fails a test that runs longer than 10 minutes (the longest
          # takes seconds), with its name and a stack dump, and goes on with the
          # rest. Not -v: the skip check below reads SKIPPED lines.
          .venv/bin/python -m pytest tests -q -rs --timeout=600 | tee pytest.log
          # Windows-only tests may skip here, and the GPU variant of the OCI
          # backend skips because hosted runners have no GPU; nothing else may.
          if grep "SKIPPED" pytest.log | grep -v "Windows feature" | grep -qv "no usable GPU"; then
            echo "::error::tests were skipped on the containment runner"
            exit 1
          fi

  # Ledger, replay and contracts on macOS and Windows. bubblewrap is Linux-only
  # and these runners have no Linux container engine (macOS has none; Windows
  # runs Windows containers), so live containment tests skip there with their
  # reasons; everything else must pass.
  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Stele with declared dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Stele suite
        run: python -m pytest tests -q -rs --timeout=600
