[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stele"
version = "0.1.0"
description = "Sandboxed document-parser execution with a verifiable artifact ledger"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# Wasm/WASI sandbox backend (stele.containment.wasm). The API used (fuel,
# epoch interruption, read-only preopens via fs_mutable) needs wasmtime 49+.
wasm = ["wasmtime>=49"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "wasmtime>=49"]

[tool.hatch.build.targets.wheel]
packages = ["stele"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Real parser images are built in their own workflow (parser-images.yml),
# which selects these tests with `-m parser_image`.
addopts = "-m 'not parser_image'"
markers = [
    "parser_image: needs a locally built parser image (tests/test_parser_images.py)",
]
